name: 쓰레드 게시글 자동 생성

on:
  schedule:
    - cron: '0 23 * * *'  # 매일 KST 08:00 (UTC 23:00 전날)
  workflow_dispatch:

# 하루 6개 = 페르소나 3개 × 2개.
# 페르소나별로 별도 단계에서 순차 생성. 페르소나 간 주제 중복 검사는 하지 않음.

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: "🕘 직전 게시글 조회 (페르소나별 중복 방지)"
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          # 조회는 부가 기능 — 실패해도 생성은 계속되어야 한다.
          with open("/tmp/recent_posts.json", "w") as f:
              json.dump([], f)

          recent = []
          try:
              SUPABASE_URL = os.environ["SUPABASE_URL"]
              SERVICE_KEY = os.environ["SUPABASE_SERVICE_KEY"]
              headers = {
                  "apikey": SERVICE_KEY,
                  "Authorization": f"Bearer {SERVICE_KEY}",
              }
              query = (
                  "threads_posts?select=topic,hook_pattern,persona,created_at,"
                  "threads_post_segments(content,order_index)"
                  "&order=created_at.desc&limit=30"
              )
              url = f"{SUPABASE_URL}/rest/v1/{query}"
              req = urllib.request.Request(url, headers=headers, method="GET")
              with urllib.request.urlopen(req, timeout=20) as r:
                  rows = json.loads(r.read())
              for row in rows:
                  segs = row.get("threads_post_segments") or []
                  body = next(
                      (s["content"] for s in segs if s.get("order_index") == 0),
                      "",
                  )
                  recent.append({
                      "persona": row.get("persona"),
                      "topic": row.get("topic"),
                      "hook_pattern": row.get("hook_pattern"),
                      "created_at": row.get("created_at"),
                      "segment_count": len(segs),  # 구조 골격 — 직전과 다르게
                      "body_preview": (body or "")[:120],
                  })
              with open("/tmp/recent_posts.json", "w") as f:
                  json.dump(recent, f, ensure_ascii=False, indent=2)
              print(f"✅ 직전 게시글 {len(recent)}개 조회됨")
          except Exception as e:
              print(f"⚠️ 조회 실패 ({type(e).__name__}: {e}) — 빈 목록으로 진행")
          EOF

      - name: "✍️ 페르소나 1 · 그로스해커형 (growth_hacker) 2개 생성"
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash --model claude-opus-4-7'
          show_full_output: true
          prompt: |
            당신은 Threads 바이럴 콘텐츠 전문가입니다. 아래 페르소나로 **2개**를 생성합니다.

            먼저 전략 문서와 직전 글을 읽으세요:
            ```bash
            cat CONTENT_STRATEGY.md
            cat /tmp/recent_posts.json
            ```

            ## 페르소나: growth_hacker (그로스해커형)
            - 어미: **`~함`체** (담백·직설. "확인해야 함", "데이터가 말해줌"). 다른 어미 금지.
            - 레인: 마케팅 원론·심리·행동(I)을 **데이터·효율·전환 각도**로. 보조로 C·D·H.
            - CONTENT_STRATEGY.md 3번(페르소나)·10번(레인) 규칙을 그대로 따르세요.

            ## 중복 검사 범위 (중요)
            - `recent_posts.json`에서 **`persona`가 `growth_hacker`인 글**하고만 주제 중복을 피하세요.
            - 다른 페르소나(strategist/field_expert) 글은 신경 쓰지 않습니다.

            ## 글 작성 순서 (내용 먼저, 구조 나중)
            1. **내용 먼저**: 이 페르소나가 오늘 가장 하고 싶은 말 하나를 결정한다. 그 말을 처음 꺼내는 가장 자연스러운 첫 줄은?
            2. **구조는 사후**: 결정한 내용을 CONTENT_STRATEGY.md 규칙으로 정제한다. 내용이 구조와 안 맞으면 내용을 살리고 구조를 조정한다.

            ## 공통 규칙 (도달 직결 — 반드시 지킬 것)
            - **본문·댓글 어디에도 외부 링크/블로그 안내/CTA 금지.** 링크는 발행 시스템이 별도 답글로 자동 부착함.
            - **글 구조 선택 (6번 참고)**: ① 리드 단독형(짧은 인사이트·단정) 또는 ② 체이닝 유도형("이유는 답글에 이어서 —" → 댓글 1에서 핵심 공개). 체이닝 유도형이 클릭·댓글·체류시간을 동시에 올려 도달에 더 강함. 최대 4개 댓글.
            - **마무리는 답글을 부르는 한 줄** — 열린 질문 / 도발 단정 / 역설 / 독자 직접 호명. 안내·CTA·"이상입니다" 금지.
            - **첫 줄은 장면·상황으로** — 주제/결론 선언형 첫 줄 금지. 특정 장면("7개월 올렸는데 문의가 없었다"), 글쓴이의 구체적 순간, 독자가 처한 상황 묘사 중 하나로 시작. 컨설팅 리포트체 금지 — 사람이 말하듯, 개인 장면 1개+.
            - 수치는 맥락 있을 때만. 출처 없는 깔끔한 백분율·비율 금지. 범위·관찰로 대체("거의 두 배", "열에 여덟은").
            - 구조 골격을 직전 글들과 다르게("N가지 + 정돈된 결론" 틀 반복 금지). N/N 표기 금지. 생성 후 14번 체크리스트 검증.
            - 2개의 주제·각도·훅·구조 골격·본문 길이가 서로 달라야 함. 둘 다 짧게 금지(최소 1개 150자+).

            ## 1번 글
            growth_hacker 직전 글과 안 겹치게 1개 생성 후 저장:
            ```bash
            python3 -c "
            import json
            post = {'persona':'growth_hacker','topic':'실제 주제','hook_pattern':3,
                    'segments':[{'order_index':0,'content':'리드 글 — 체이닝형: 핵심 미공개+"이유는 답글에 이어서 —" 마무리 / 단독형: 완결. 링크/CTA 없음'}]}
            # 체이닝 유도형이면 post["segments"] += [{"order_index":1,"content":"핵심 공개"},{"order_index":2,"content":"심화"}, ...] 추가(최대 4개)
            json.dump(post, open('/tmp/growth_hacker_1.json','w'), ensure_ascii=False, indent=2)
            print('growth_hacker_1 저장')
            "
            ```

            ## 2번 글
            먼저 1번 글을 다시 읽으세요:
            ```bash
            cat /tmp/growth_hacker_1.json
            ```
            1번 글 + growth_hacker 직전 글과 주제·각도·훅·템플릿·구조가 모두 다르게 1개 생성
            → 같은 형식으로 `/tmp/growth_hacker_2.json`에 저장 (persona는 'growth_hacker').

            **Supabase 저장 금지. 파일 저장만.**

      - name: "✍️ 페르소나 2 · 심리전략가형 (strategist) 2개 생성"
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash --model claude-opus-4-7'
          show_full_output: true
          prompt: |
            당신은 Threads 바이럴 콘텐츠 전문가입니다. 아래 페르소나로 **2개**를 생성합니다.

            먼저 전략 문서와 직전 글을 읽으세요:
            ```bash
            cat CONTENT_STRATEGY.md
            cat /tmp/recent_posts.json
            ```

            ## 페르소나: strategist (심리전략가형)
            - 어미: **`~입니다`/`~합니다`체** 기본. **반말(`~야`/`~거야`/`~이야`) 허용** — 반말이 댓글 참여율 높음. 글 시작 전 결정, 한 글 안에서 혼용 금지.
            - 레인: 마케팅 본질·고객심리·가치제안(I)을 **본질·심리 각도**로. 보조로 E·C.
            - CONTENT_STRATEGY.md 3번(페르소나)·10번(레인) 규칙을 그대로 따르세요.

            ## 중복 검사 범위 (중요)
            - `recent_posts.json`에서 **`persona`가 `strategist`인 글**하고만 주제 중복을 피하세요.
            - 다른 페르소나 글은 신경 쓰지 않습니다.

            ## 글 작성 순서 (내용 먼저, 구조 나중)
            1. **내용 먼저**: 이 페르소나가 오늘 가장 하고 싶은 말 하나를 결정한다. 그 말을 처음 꺼내는 가장 자연스러운 첫 줄은?
            2. **구조는 사후**: 결정한 내용을 CONTENT_STRATEGY.md 규칙으로 정제한다. 내용이 구조와 안 맞으면 내용을 살리고 구조를 조정한다.

            ## 공통 규칙 (도달 직결 — 반드시 지킬 것)
            - **본문·댓글 어디에도 외부 링크/블로그 안내/CTA 금지.** 링크는 발행 시스템이 별도 답글로 자동 부착함.
            - **글 구조 선택 (6번 참고)**: ① 리드 단독형(짧은 인사이트·단정) 또는 ② 체이닝 유도형("이유는 답글에 이어서 —" → 댓글 1에서 핵심 공개). 체이닝 유도형이 클릭·댓글·체류시간을 동시에 올려 도달에 더 강함. 최대 4개 댓글.
            - **마무리는 답글을 부르는 한 줄** — 열린 질문 / 도발 단정 / 역설 / 독자 직접 호명. 안내·CTA·"이상입니다" 금지.
            - **첫 줄은 장면·상황으로** — 주제/결론 선언형 첫 줄 금지. 특정 장면("7개월 올렸는데 문의가 없었다"), 글쓴이의 구체적 순간, 독자가 처한 상황 묘사 중 하나로 시작. 컨설팅 리포트체 금지 — 사람이 말하듯, 개인 장면 1개+.
            - 수치는 맥락 있을 때만. 출처 없는 깔끔한 백분율·비율 금지. 범위·관찰로 대체("거의 두 배", "열에 여덟은").
            - 구조 골격을 직전 글들과 다르게("N가지 + 정돈된 결론" 틀 반복 금지). N/N 표기 금지. 생성 후 14번 체크리스트 검증.
            - 2개의 주제·각도·훅·구조 골격·본문 길이가 서로 달라야 함. 둘 다 짧게 금지(최소 1개 150자+).

            ## 1번 글
            strategist 직전 글과 안 겹치게 1개 생성 후 저장:
            ```bash
            python3 -c "
            import json
            post = {'persona':'strategist','topic':'실제 주제','hook_pattern':2,
                    'segments':[{'order_index':0,'content':'리드 글 — 체이닝형: 핵심 미공개+"이유는 답글에 이어서 —" 마무리 / 단독형: 완결. 링크/CTA 없음'}]}
            # 체이닝 유도형이면 post["segments"] += [{"order_index":1,"content":"핵심 공개"},{"order_index":2,"content":"심화"}, ...] 추가(최대 4개)
            json.dump(post, open('/tmp/strategist_1.json','w'), ensure_ascii=False, indent=2)
            print('strategist_1 저장')
            "
            ```

            ## 2번 글
            먼저 1번 글을 다시 읽으세요:
            ```bash
            cat /tmp/strategist_1.json
            ```
            1번 글 + strategist 직전 글과 주제·각도·훅·템플릿·구조가 모두 다르게 1개 생성
            → 같은 형식으로 `/tmp/strategist_2.json`에 저장 (persona는 'strategist').

            **Supabase 저장 금지. 파일 저장만.**

      - name: "✍️ 페르소나 3 · 필드전문가형 (field_expert) 2개 생성"
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash --model claude-opus-4-7'
          show_full_output: true
          prompt: |
            당신은 Threads 바이럴 콘텐츠 전문가입니다. 아래 페르소나로 **2개**를 생성합니다.

            먼저 전략 문서와 직전 글을 읽으세요:
            ```bash
            cat CONTENT_STRATEGY.md
            cat /tmp/recent_posts.json
            ```

            ## 페르소나: field_expert (필드전문가형)
            - 어미: **`~한다`체** (자신감·사례 중심. "다르다", "허물어야 한다"). 다른 어미 금지.
            - 레인: **전문직 마케팅 일반(A~F·H)** + **세부 전문직별 케이스(G)**.
              2개 중 1개는 A~F·H, 다른 1개는 G(업종 케이스, 업종 로테이션 — 2번 규칙 준수).
            - CONTENT_STRATEGY.md 3번(페르소나)·10번(레인)·2번(업종 로테이션) 규칙을 따르세요.

            ## 중복 검사 범위 (중요)
            - `recent_posts.json`에서 **`persona`가 `field_expert`인 글**하고만 주제·업종 중복을 피하세요.
            - 다른 페르소나 글은 신경 쓰지 않습니다.

            ## 글 작성 순서 (내용 먼저, 구조 나중)
            1. **내용 먼저**: 이 페르소나가 오늘 가장 하고 싶은 말 하나를 결정한다. 그 말을 처음 꺼내는 가장 자연스러운 첫 줄은?
            2. **구조는 사후**: 결정한 내용을 CONTENT_STRATEGY.md 규칙으로 정제한다. 내용이 구조와 안 맞으면 내용을 살리고 구조를 조정한다.

            ## 공통 규칙 (도달 직결 — 반드시 지킬 것)
            - **본문·댓글 어디에도 외부 링크/블로그 안내/CTA 금지.** 링크는 발행 시스템이 별도 답글로 자동 부착함.
            - **리드(본문) 글은 단독으로 완결.** 댓글은 꼭 필요할 때만 2~4개(없으면 더 좋음).
            - **마무리는 답글을 부르는 한 줄**(열린 질문/도발/역설/직접 호명). 안내·CTA·"이상입니다" 금지.
            - **첫 줄은 장면·상황으로** — 주제/결론 선언형 첫 줄 금지. 특정 장면, 글쓴이의 구체적 순간, 독자가 처한 상황 묘사 중 하나로 시작.
            - 컨설팅 리포트체 금지 — 사람이 말하듯, 개인 장면 1개+. 구조 골격 직전 글과 다르게. 수치는 맥락 있을 때만(출처 없는 백분율 금지).
            - 2개가 둘 다 케이스 스터디(6-6)면 안 됨. 본문 길이 서로 다르게(최소 1개 150자+). N/N 표기 금지.

            ## 1번 글 — 전문직 마케팅 일반(A~F·H)
            field_expert 직전 글과 안 겹치게 1개 생성 후 저장:
            ```bash
            python3 -c "
            import json
            post = {'persona':'field_expert','topic':'실제 주제','hook_pattern':1,
                    'segments':[{'order_index':0,'content':'리드 글 — 체이닝형: 핵심 미공개+"이유는 답글에 이어서 —" 마무리 / 단독형: 완결. 링크/CTA 없음'}]}
            # 체이닝 유도형이면 post["segments"] += [{"order_index":1,"content":"핵심 공개"},{"order_index":2,"content":"심화"}, ...] 추가(최대 4개)
            json.dump(post, open('/tmp/field_expert_1.json','w'), ensure_ascii=False, indent=2)
            print('field_expert_1 저장')
            "
            ```

            ## 2번 글 — 세부 전문직별 케이스(G)
            먼저 1번 글을 다시 읽으세요:
            ```bash
            cat /tmp/field_expert_1.json
            ```
            1번 글 + field_expert 직전 글과 주제·업종·구조가 다르게, 특정 업종 케이스 1개 생성
            → 같은 형식으로 `/tmp/field_expert_2.json`에 저장 (persona는 'field_expert').

            **Supabase 저장 금지. 파일 저장만.**

      - name: "💾 Supabase 저장 (페르소나별)"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SERVICE_KEY = os.environ["SUPABASE_SERVICE_KEY"]

          headers = {
              "apikey": SERVICE_KEY,
              "Authorization": f"Bearer {SERVICE_KEY}",
              "Content-Type": "application/json",
              "Prefer": "return=representation",
          }

          def supabase_post(path, body):
              url = f"{SUPABASE_URL}/rest/v1/{path}"
              data = json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method="POST")
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # 6개 파일을 모은다. 파일명에서 persona를 유도(JSON에 없으면 fallback).
          files = [
              ("growth_hacker", "/tmp/growth_hacker_1.json"),
              ("growth_hacker", "/tmp/growth_hacker_2.json"),
              ("strategist", "/tmp/strategist_1.json"),
              ("strategist", "/tmp/strategist_2.json"),
              ("field_expert", "/tmp/field_expert_1.json"),
              ("field_expert", "/tmp/field_expert_2.json"),
          ]

          posts = []
          for persona, path in files:
              try:
                  with open(path) as f:
                      post = json.load(f)
              except FileNotFoundError:
                  print(f"⚠️ 누락: {path} — 건너뜀")
                  continue
              post["persona"] = post.get("persona") or persona
              posts.append(post)

          if not posts:
              raise SystemExit("❌ 생성된 게시글 파일이 하나도 없습니다")

          # 미리보기 단계용으로도 남긴다.
          with open("/tmp/posts_batch.json", "w") as f:
              json.dump(posts, f, ensure_ascii=False, indent=2)

          for post in posts:
              post_record = supabase_post("threads_posts", {
                  "topic": post["topic"],
                  "hook_pattern": post.get("hook_pattern"),
                  "persona": post["persona"],
                  "status": "draft",
              })
              post_id = post_record[0]["id"]
              print(f"✅ [{post['persona']}] 저장됨: {post_id}")

              segments = [
                  {"post_id": post_id, "order_index": s["order_index"], "content": s["content"]}
                  for s in post["segments"]
              ]
              supabase_post("threads_post_segments", segments)
              print(f"   세그먼트 {len(segments)}개 저장")

          print(f"\n✅ 완료 — 드래프트 {len(posts)}개 저장됨")
          EOF

      - name: "📋 생성된 게시글 미리보기 (페르소나별)"
        run: |
          python3 - <<'EOF'
          import json
          from collections import defaultdict

          PERSONAS = [
              ("growth_hacker",  "🔵 GROWTH_HACKER  · 그로스해커형"),
              ("strategist",     "🟡 STRATEGIST     · 심리전략가형"),
              ("field_expert",   "🟢 FIELD_EXPERT   · 필드전문가형"),
          ]

          with open("/tmp/posts_batch.json") as f:
              posts = json.load(f)

          grouped = defaultdict(list)
          for post in posts:
              grouped[post.get("persona", "unknown")].append(post)

          total = 0
          for persona_key, persona_label in PERSONAS:
              group = grouped.get(persona_key, [])
              if not group:
                  continue

              print(f"\n{'█'*64}")
              print(f"  {persona_label}  ({len(group)}개)")
              print(f"{'█'*64}")

              for idx, post in enumerate(group, 1):
                  segs = sorted(post["segments"], key=lambda s: s["order_index"])
                  seg_count = len(segs)
                  print(f"\n  ┌─ [{idx}/{len(group)}]  {post['topic']}")
                  print(f"  │  훅 패턴 {post.get('hook_pattern', '-')} · 세그먼트 {seg_count}개")
                  print(f"  └{'─'*58}")

                  for seg in segs:
                      if seg["order_index"] == 0:
                          tag = "📌 본문"
                      else:
                          tag = f"💬 댓글 {seg['order_index']}"
                      print(f"\n  [{tag}]")
                      for line in seg["content"].splitlines():
                          print(f"  {line}")

                  total += 1

          print(f"\n{'─'*64}")
          print(f"  ✅ 총 {total}개 생성 완료")
          print(f"{'─'*64}")
          EOF
