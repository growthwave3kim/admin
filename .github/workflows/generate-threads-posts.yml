            - **2개 중 1개는 체이닝 유도형** (댓글 1에서 핵심 공개, 최대 6개), **1개는 리드 단독형**.
            - **마무리 다양화**: 질문/도발 단정/역설/직접 호명/다음 편 예고 중 선택. 2개 같은 방식 금지.
            - **첫 줄은 장면·상황으로** — 주제/결론 선언형 첫 줄 금지. 컨설팅 리포트체 금지.
            - 수치는 맥락 있을 때만. 출처 없는 수치 금지 → 범위·관찰로 대체.
            - N/N 표기 금지. 2개의 주제·각도·훅·구조·본문 길이·마무리가 서로 달라야 함.

            ## AI 티 금지
            - "A가 아니라 B다" 반전 대구 글당 최대 1회
            - "공통점이 하나 있다" / "차이는 여기서 갈린다" / "결국 두 가지" 금지
            - 모든 문장 15~30자 균일 금지 → 리듬 들쭉날쭉하게

            ## 1번 글 — 트랙 B(마케팅 인사이트)
            field_expert 직전 글과 안 겹치게 1개 생성 후 저장:
            ```bash
            python3 -c "
            import json
            post = {'persona':'field_expert','topic':'실제 주제','hook_pattern':1,
                    'segments':[{'order_index':0,'content':'리드 글 — 체이닝형: 가장 궁금한 지점에서 툭 끊기 / 단독형: 완결. 링크/CTA 없음'}]}
            # 체이닝 유도형이면 post['segments'] += [{'order_index':1,'content':'핵심 공개'}, ...] 추가(최대 6개)
            json.dump(post, open('/tmp/field_expert_1.json','w'), ensure_ascii=False, indent=2)
            print('field_expert_1 저장')
            "
            ```

            ## 2번 글 — 트랙 A(전문직 케이스)
            ```bash
            cat /tmp/field_expert_1.json
            ```
            1번 글 + field_expert 직전 글과 주제·업종·구조가 다르게, 특정 업종 케이스 1개 생성
            → `/tmp/field_expert_2.json`에 저장.

            **Supabase 저장 금지. 파일 저장만.**

      - name: "💾 Supabase 저장"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SERVICE_KEY = os.environ["SUPABASE_SERVICE_KEY"]
          headers = {
              "apikey": SERVICE_KEY,
              "Authorization": f"Bearer {SERVICE_KEY}",
              "Content-Type": "application/json",
              "Prefer": "return=representation",
          }

          def supabase_post(path, body):
              url = f"{SUPABASE_URL}/rest/v1/{path}"
              data = json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method="POST")
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          for path in ["/tmp/field_expert_1.json", "/tmp/field_expert_2.json"]:
              try:
                  with open(path) as f:
                      post = json.load(f)
              except FileNotFoundError:
                  print(f"⚠️ 누락: {path} — 건너뜀")
                  continue
              post.setdefault("persona", "field_expert")
              rec = supabase_post("threads_posts", {
                  "topic": post["topic"],
                  "hook_pattern": post.get("hook_pattern"),
                  "persona": post["persona"],
                  "status": "draft",
              })
              post_id = rec[0]["id"]
              print(f"✅ [{post['persona']}] 저장됨: {post_id}")
              segs = [{"post_id": post_id, "order_index": s["order_index"], "content": s["content"]} for s in post["segments"]]
              supabase_post("threads_post_segments", segs)
              print(f"   세그먼트 {len(segs)}개 저장")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: posts-field-expert
          path: /tmp/field_expert_*.json
          if-no-files-found: warn

  agency_brand:
    name: "🟠 그로스웨이브"
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: recent-posts
          path: /tmp

      - name: "✍️ 2개 생성"
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash --model claude-opus-4-7'
          show_full_output: true
          prompt: |
            당신은 Threads 바이럴 콘텐츠 전문가입니다. 그로스웨이브 브랜드 계정으로 **2개**를 생성합니다.

            먼저 전략 문서와 직전 글을 읽으세요:
            ```bash
            cat CONTENT_STRATEGY.md
            cat /tmp/recent_posts.json
            ```

            ## 페르소나: agency_brand (그로스웨이브 공식 계정)
            - 어미: **`~해요` / `~거든요` / `~더라고요`** (대행사 담당자 구어체). `~합니다`체나 반말과 섞지 말 것.
            - 1인칭: "저희가", "우리 팀이" 사용 가능.
            - 핵심 톤: **자랑이 아니라 관찰**. "저희가 잘했어요"가 아니라 "저희가 보니까 이렇더라고요".
            - 타겟: 마케팅 대행사를 찾고 있거나 혼자 하다가 한계를 느끼는 전문직 개업자.
            - 주제: **트랙 A(클라이언트 실전 케이스) 1개 + 트랙 B(대행사 관점 인사이트) 1개**

            ## 중복 검사 범위 (중요)
            - `recent_posts.json`에서 **`persona`가 `agency_brand`인 글**하고만 주제·케이스 중복을 피하세요.
            - 다른 페르소나 글은 신경 쓰지 않습니다.

            ## 케이스 소재 뱅크 (2개 각각 다른 케이스 선택, 장면·대사 하나만 뽑아 변주)
            [세무사] 블로그 7개월, 세법 해설만 가득, 대표 얼굴·이름 없음. 첫 미팅에서 "저 블로그 열심히 썼는데"라고 했는데 그 블로그에 대표 사진이 없었음. 구체 사례+대표 소개 추가 후 두 달 만에 "블로그 보고 연락드려요" 첫 문의.
            [변호사] 팔로워 수백명인데 상담예약 없음. 게시글마다 "상담 문의는 DM으로" 붙어있음. 미팅에서 "변호사가 인간적인 면 보이면 품위유지의무 위반 아니냐"고 진지하게 물어봄. 신뢰 글 추가 후 "글 보고 오래 봤는데 한번 상담받고 싶다" 첫 문의.
            [한의사] 개원 3년차, 입소문 있는데 새 환자 안 옴. "한의원은 효과 믿는 사람만 오는 거 아니냐" → 실제 새 환자 첫 방문 이유 물어보니 "인터넷에서 찾다가"가 가장 많았음.
            [노무사] B2B라 SNS 효과 없을 거라 생각. "노무사가 SNS 하면 직원들이 보는 거 아니냐"는 우려 → 실제 DM은 사장님들한테서. "글 보고 이 분이 뭔지 알 것 같아서".
            [공통 패턴] 첫 미팅 반복 대사: "전에 대행사 써봤는데 효과 없었어요" / "우리 업종은 SNS가 안 돼요" (이 말 하는 분들이 가장 빠르게 결과 나오는 케이스 있음) / 계정 열면 공통: 정보는 있는데 사람이 없음.

            ## 글 작성 순서 (내용 먼저, 구조 나중)
            1. **케이스 선택**: 뱅크에서 장면 하나·대사 하나 선택. 직전 agency_brand 글과 다른 케이스.
            2. **내용 먼저**: 그 케이스에서 하고 싶은 관찰 하나. 그 관찰을 꺼내는 자연스러운 첫 줄.
            3. **구조는 사후**: CONTENT_STRATEGY.md 규칙으로 정제.

            ## 공통 규칙
            - **본문·댓글 어디에도 외부 링크/CTA 금지.**
            - **2개 중 1개는 체이닝 유도형** (댓글 1에서 핵심 공개, 최대 6개), **1개는 리드 단독형**.
            - **마무리 다양화**: 질문/단정/여운/상황 중 선택. 2개 같은 방식 금지.
            - **첫 줄은 장면·상황으로** — 주제/결론 선언형 금지.
            - 가짜 수치 금지 → 범위·관찰로 ("거의 두 배", "열에 여덟은").
            - "안녕하세요" / "오늘은" / "결론적으로" / "공개합니다" / "요약하자면" 금지.
            - 대행사 자랑 톤 금지 → 관찰 톤으로.
            - 모든 문장 균일 금지 → 리듬 들쭉날쭉하게.

            ## AI 티 금지
            - "저희가 잘했다"가 아니라 "저희가 보니까 이렇더라"
            - "문제 있는 고객 → 우리 등장 → 해결" 3막 구조 반복 금지
            - "A가 아니라 B다" 반전 대구 글당 1회 이하
            - "공통점이 하나 있다" / "결국 두 가지" / "차이는 여기서 갈린다" 금지

            ## 1번 글 — 트랙 A(클라이언트 케이스)
            agency_brand 직전 글과 안 겹치게 1개 생성 후 저장:
            ```bash
            python3 -c "
            import json
            post = {'persona':'agency_brand','topic':'실제 주제','hook_pattern':1,
                    'segments':[{'order_index':0,'content':'리드 글 — 체이닝형: 가장 궁금한 지점에서 툭 끊기 / 단독형: 완결. 링크/CTA 없음'}]}
            # 체이닝 유도형이면 post['segments'] += [{'order_index':1,'content':'핵심 공개'}, ...] 추가(최대 6개)
            json.dump(post, open('/tmp/agency_brand_1.json','w'), ensure_ascii=False, indent=2)
            print('agency_brand_1 저장')
            "
            ```

            ## 2번 글 — 트랙 B(대행사 관점 인사이트)
            ```bash
            cat /tmp/agency_brand_1.json
            ```
            1번 글 + agency_brand 직전 글과 케이스·주제·각도·구조가 모두 다르게 1개 생성
            → `/tmp/agency_brand_2.json`에 저장.

            **Supabase 저장 금지. 파일 저장만.**

      - name: "💾 Supabase 저장"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SERVICE_KEY = os.environ["SUPABASE_SERVICE_KEY"]
          headers = {
              "apikey": SERVICE_KEY,
              "Authorization": f"Bearer {SERVICE_KEY}",
              "Content-Type": "application/json",
              "Prefer": "return=representation",
          }

          def supabase_post(path, body):
              url = f"{SUPABASE_URL}/rest/v1/{path}"
              data = json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method="POST")
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          for path in ["/tmp/agency_brand_1.json", "/tmp/agency_brand_2.json"]:
              try:
                  with open(path) as f:
                      post = json.load(f)
              except FileNotFoundError:
                  print(f"⚠️ 누락: {path} — 건너뜀")
                  continue
              post.setdefault("persona", "agency_brand")
              rec = supabase_post("threads_posts", {
                  "topic": post["topic"],
                  "hook_pattern": post.get("hook_pattern"),
                  "persona": post["persona"],
                  "status": "draft",
              })
              post_id = rec[0]["id"]
              print(f"✅ [{post['persona']}] 저장됨: {post_id}")
              segs = [{"post_id": post_id, "order_index": s["order_index"], "content": s["content"]} for s in post["segments"]]
              supabase_post("threads_post_segments", segs)
              print(f"   세그먼트 {len(segs)}개 저장")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: posts-agency-brand
          path: /tmp/agency_brand_*.json
          if-no-files-found: warn

  summary:
    name: "📋 생성 완료"
    needs: [growth_hacker, strategist, field_expert, agency_brand]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: posts-*
          path: /tmp/posts
          merge-multiple: true

      - name: "📋 미리보기 (페르소나별)"
        run: |
          python3 - <<'EOF'
          import json, glob
          from collections import defaultdict

          PERSONAS = [
              ("growth_hacker",  "🔵 GROWTH_HACKER  · 그로스해커형"),
              ("strategist",     "🟡 STRATEGIST     · 심리전략가형"),
              ("field_expert",   "🟢 FIELD_EXPERT   · 필드전문가형"),
              ("agency_brand",   "🟠 AGENCY_BRAND   · 그로스웨이브"),
          ]

          posts = []
          for path in glob.glob("/tmp/posts/*.json"):
              try:
                  with open(path) as f:
                      posts.append(json.load(f))
              except Exception as e:
                  print(f"⚠️ {path} 읽기 실패: {e}")

          grouped = defaultdict(list)
          for post in posts:
              grouped[post.get("persona", "unknown")].append(post)

          total = 0
          for persona_key, persona_label in PERSONAS:
              group = grouped.get(persona_key, [])
              if not group:
                  continue
              print(f"\n{'█'*64}")
              print(f"  {persona_label}  ({len(group)}개)")
              print(f"{'█'*64}")
              for idx, post in enumerate(group, 1):
                  segs = sorted(post["segments"], key=lambda s: s["order_index"])
                  print(f"\n  ┌─ [{idx}/{len(group)}]  {post['topic']}")
                  print(f"  │  훅 패턴 {post.get('hook_pattern', '-')} · 세그먼트 {len(segs)}개")
                  print(f"  └{'─'*58}")
                  for seg in segs:
                      tag = "📌 본문" if seg["order_index"] == 0 else f"💬 댓글 {seg['order_index']}"
                      print(f"\n  [{tag}]")
                      for line in seg["content"].splitlines():
                          print(f"  {line}")
                  total += 1

          print(f"\n{'─'*64}")
          print(f"  ✅ 총 {total}개 생성 완료")
          print(f"{'─'*64}")
          EOF
