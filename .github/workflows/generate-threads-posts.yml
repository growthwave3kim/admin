name: 쓰레드 게시글 자동 생성

on:
  schedule:
    - cron: '0 23 * * *'  # 매일 KST 08:00 (UTC 23:00 전날)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: "🕘 직전 게시글 조회 (중복 방지)"
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          # 조회는 부가 기능 — 어떤 이유로든 실패해도 생성은 계속되어야 한다.
          # 항상 파일을 먼저 빈 배열로 만들어 두고 best-effort로 채운다.
          with open("/tmp/recent_posts.json", "w") as f:
              json.dump([], f)

          recent = []
          try:
              SUPABASE_URL = os.environ["SUPABASE_URL"]
              SERVICE_KEY = os.environ["SUPABASE_SERVICE_KEY"]
              headers = {
                  "apikey": SERVICE_KEY,
                  "Authorization": f"Bearer {SERVICE_KEY}",
              }
              query = (
                  "threads_posts?select=topic,hook_pattern,created_at,"
                  "threads_post_segments(content,order_index)"
                  "&order=created_at.desc&limit=15"
              )
              url = f"{SUPABASE_URL}/rest/v1/{query}"
              req = urllib.request.Request(url, headers=headers, method="GET")
              with urllib.request.urlopen(req, timeout=20) as r:
                  rows = json.loads(r.read())
              for row in rows:
                  segs = row.get("threads_post_segments") or []
                  body = next(
                      (s["content"] for s in segs if s.get("order_index") == 0),
                      "",
                  )
                  recent.append({
                      "topic": row.get("topic"),
                      "hook_pattern": row.get("hook_pattern"),
                      "created_at": row.get("created_at"),
                      "body_preview": (body or "")[:120],
                  })
              with open("/tmp/recent_posts.json", "w") as f:
                  json.dump(recent, f, ensure_ascii=False, indent=2)
              print(f"✅ 직전 게시글 {len(recent)}개 조회됨")
          except Exception as e:
              print(f"⚠️ 조회 실패 ({type(e).__name__}: {e}) — 빈 목록으로 진행")
          EOF

      - name: "✍️ 게시글 생성 (Claude)"
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash'
          show_full_output: true
          prompt: |
            당신은 Threads에서 바이럴되는 콘텐츠를 작성하는 전문가입니다.

            ## 준비

            먼저 전략 문서와 직전 게시글을 읽으세요. 이 두 가지는 3개 글 전체에 계속 적용됩니다.
            ```bash
            cat CONTENT_STRATEGY.md
            cat /tmp/recent_posts.json
            ```
            - `recent_posts.json`의 topic·hook_pattern·body_preview와 겹치는
              주제/훅/구조/소제목/케이스 스터디 전개를 반복하지 마세요.

            ## 작업 — 게시글을 **한 개씩 순차적으로 3번** 생성

            절대 한 번에 3개를 만들지 마세요. 아래 1 → 2 → 3 순서를 그대로 따르고,
            매 단계에서 **직전에 만든 글 파일을 다시 읽어 주제 중복을 직접 검사**하세요.

            ### 공통 규칙 (매 글마다 적용)
            - **N/N 페이지 표시 절대 금지** (1/6 같은 표기)
            - AI 티 금지, 실제 현장 전문가처럼 자연스럽게
            - 생성 후 CONTENT_STRATEGY.md 체크리스트로 자가 검증·수정
            - 마케팅 원론·심리·행동(I클러스터)을 가장 자주, 전문직 일반(A~F·H)이 두 번째,
              업종 케이스(G클러스터)는 3개 통틀어 최대 1개
            - 케이스 스터디(6-6)는 3개 통틀어 최대 1개. 쓰더라도
              "#1. 처음 상황 → #2. 바꾼 것 → #3. 왜 통했나 → #4. 결과" 고정 구조 절대 금지
              (역순/대화체/스토리형/비교형 중 택1, 소제목 매번 새로)
            - 본문 길이: 3개가 서로 달라야 하고 최소 1개는 중간(150~300자) 이상,
              모두 짧게(50~150자) 금지

            ### 1번 글
            - `recent_posts.json`와만 안 겹치게 1개 생성
            - 아래 명령으로 저장 (segments는 본문 order_index 0 + 댓글들):
            ```bash
            python3 -c "
            import json
            post = {'topic': '실제 주제', 'hook_pattern': 3,
                    'segments': [{'order_index': 0, 'content': '본문'},
                                 {'order_index': 1, 'content': '댓글1'}]}
            json.dump(post, open('/tmp/post_1.json','w'), ensure_ascii=False, indent=2)
            print('post_1 저장')
            "
            ```

            ### 2번 글
            - 먼저 1번 글을 다시 읽으세요:
            ```bash
            cat /tmp/post_1.json
            ```
            - `recent_posts.json` **그리고 방금 읽은 1번 글**과 주제·훅·템플릿·클러스터·
              구조가 모두 다르게 1개 생성 → `/tmp/post_2.json`에 같은 형식으로 저장
              (변수명 post, 파일명만 post_2.json)

            ### 3번 글
            - 먼저 1번·2번 글을 다시 읽으세요:
            ```bash
            cat /tmp/post_1.json /tmp/post_2.json
            ```
            - `recent_posts.json` **그리고 1번·2번 글 모두**와 겹치지 않게 1개 생성
              → `/tmp/post_3.json`에 저장

            ### 마지막: 3개 병합
            세 글의 구조가 비슷하면 해당 글을 재작성한 뒤, 아래로 병합하세요:
            ```bash
            python3 -c "
            import json
            posts = [json.load(open(f'/tmp/post_{i}.json')) for i in (1,2,3)]
            json.dump(posts, open('/tmp/posts_batch.json','w'), ensure_ascii=False, indent=2)
            print(f'{len(posts)}개 병합 완료')
            "
            cat /tmp/posts_batch.json | python3 -c "import sys,json; print(len(json.load(sys.stdin)),'개')"
            ```

            **Supabase 저장은 하지 마세요. 파일 저장만 합니다.**

      - name: "💾 Supabase 저장"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SERVICE_KEY = os.environ["SUPABASE_SERVICE_KEY"]

          headers = {
              "apikey": SERVICE_KEY,
              "Authorization": f"Bearer {SERVICE_KEY}",
              "Content-Type": "application/json",
              "Prefer": "return=representation",
          }

          def supabase_post(path, body):
              url = f"{SUPABASE_URL}/rest/v1/{path}"
              data = json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method="POST")
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          with open("/tmp/posts_batch.json") as f:
              posts = json.load(f)

          for post in posts:
              post_record = supabase_post("threads_posts", {
                  "topic": post["topic"],
                  "hook_pattern": post.get("hook_pattern"),
                  "status": "draft",
              })
              post_id = post_record[0]["id"]
              print(f"✅ 저장됨: {post_id}")

              segments = [
                  {"post_id": post_id, "order_index": s["order_index"], "content": s["content"]}
                  for s in post["segments"]
              ]
              supabase_post("threads_post_segments", segments)
              print(f"   세그먼트 {len(segments)}개 저장")

          print(f"\n✅ 완료 — 드래프트 {len(posts)}개 저장됨")
          EOF

      - name: "📋 생성된 게시글 미리보기"
        run: |
          python3 - <<'EOF'
          import json

          with open("/tmp/posts_batch.json") as f:
              posts = json.load(f)

          for i, post in enumerate(posts, 1):
              print(f"\n{'='*60}")
              print(f"  게시글 {i}: {post['topic']}")
              print(f"  훅 패턴: {post.get('hook_pattern', '-')}")
              print(f"{'='*60}")
              for seg in sorted(post["segments"], key=lambda s: s["order_index"]):
                  label = "📌 본문" if seg["order_index"] == 0 else f"💬 댓글{seg['order_index']}"
                  print(f"\n[{label}]")
                  print(seg["content"])
          print(f"\n{'='*60}")
          EOF
