name: 쓰레드 게시글 자동 생성

on:
  schedule:
    - cron: '0 23 * * *'  # 매일 KST 08:00 (UTC 23:00 전날)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: "🕘 직전 게시글 조회 (중복 방지)"
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          # 조회는 부가 기능 — 어떤 이유로든 실패해도 생성은 계속되어야 한다.
          # 항상 파일을 먼저 빈 배열로 만들어 두고 best-effort로 채운다.
          with open("/tmp/recent_posts.json", "w") as f:
              json.dump([], f)

          recent = []
          try:
              SUPABASE_URL = os.environ["SUPABASE_URL"]
              SERVICE_KEY = os.environ["SUPABASE_SERVICE_KEY"]
              headers = {
                  "apikey": SERVICE_KEY,
                  "Authorization": f"Bearer {SERVICE_KEY}",
              }
              query = (
                  "threads_posts?select=topic,hook_pattern,created_at,"
                  "threads_post_segments(content,order_index)"
                  "&order=created_at.desc&limit=15"
              )
              url = f"{SUPABASE_URL}/rest/v1/{query}"
              req = urllib.request.Request(url, headers=headers, method="GET")
              with urllib.request.urlopen(req, timeout=20) as r:
                  rows = json.loads(r.read())
              for row in rows:
                  segs = row.get("threads_post_segments") or []
                  body = next(
                      (s["content"] for s in segs if s.get("order_index") == 0),
                      "",
                  )
                  recent.append({
                      "topic": row.get("topic"),
                      "hook_pattern": row.get("hook_pattern"),
                      "created_at": row.get("created_at"),
                      "body_preview": (body or "")[:120],
                  })
              with open("/tmp/recent_posts.json", "w") as f:
                  json.dump(recent, f, ensure_ascii=False, indent=2)
              print(f"✅ 직전 게시글 {len(recent)}개 조회됨")
          except Exception as e:
              print(f"⚠️ 조회 실패 ({type(e).__name__}: {e}) — 빈 목록으로 진행")
          EOF

      - name: "✍️ 게시글 생성 (Claude)"
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools Bash'
          show_full_output: true
          prompt: |
            당신은 Threads에서 바이럴되는 콘텐츠를 작성하는 전문가입니다.

            ## 작업

            1. CONTENT_STRATEGY.md를 읽고 모든 규칙을 숙지하세요:
            ```bash
            cat CONTENT_STRATEGY.md
            ```

            2. 직전 게시글들을 확인하세요:
            ```bash
            cat /tmp/recent_posts.json
            ```
               - 이 목록의 topic·hook_pattern·body_preview와 겹치는 주제/훅/구조/소제목/케이스 스터디 전개를 반복하지 마세요
               - 오늘 생성할 3개는 서로 달라야 하고, 동시에 위 직전 글들과도 달라야 합니다

            3. 오늘의 Threads 게시글 **3개**를 생성하세요:
               - 3개 모두 서로 다른 주제·훅 패턴·템플릿·클러스터 사용
               - **N/N 페이지 표시 절대 금지** (1/6 같은 표기)
               - AI 티 금지, 실제 현장 전문가처럼 자연스럽게
               - 생성 후 체크리스트 자가 검증 및 수정

               **본문(order_index: 0) 길이 규칙 — 반드시 지킬 것:**
               - 3개 게시글의 본문 길이는 서로 달라야 한다 (모두 짧음 금지)
               - 짧음(50~150자)은 훅이 매우 강하거나 인간 티 타입(A/B/C/D)일 때만
               - 3개 중 적어도 1개는 본문이 중간(150~300자) 이상이어야 한다
               - 본문을 짧게 썼다면 스스로 이유를 한 줄로 확인하고 납득되면 유지, 아니면 늘릴 것

               **주제 계층 — 반드시 지킬 것:**
               - 마케팅 원론·심리·행동(I클러스터) 주제를 가장 자주 선택
               - 전문직 마케팅 일반(A~F·H클러스터)이 두 번째
               - 특정 업종 케이스(G클러스터)는 세 번째 — 3개 중 G클러스터는 최대 1개

               **포맷·구조 규칙 — 가장 중요:**
               - 3개 중 케이스 스터디(6-6)는 최대 1개. 나머지는 다른 템플릿(6-5 인사이트형, 6-7 안티체크리스트, 6-8 프레임워크, 6-9 시행착오 등)
               - 케이스 스터디를 쓰더라도 "#1. 처음 상황 → #2. 바꾼 것 → #3. 왜 통했나 → #4. 결과" 고정 구조 절대 금지
               - 케이스 스터디 변형 옵션: 결과 먼저(역순), 대화체 서술, 소제목 없는 스토리형, 잘된 케이스 vs 안된 케이스 비교형
               - 소제목도 매번 새로 만들 것. "처음 상황", "바꾼 것", "결과" 반복 금지
               - 생성 완료 후 3개 중 구조가 비슷한 글이 있으면 반드시 재작성

            4. 게시글 3개가 완성되면 반드시 아래 bash 명령으로 파일을 저장하세요:

            ```bash
            python3 -c "
            import json
            posts = [
              {
                'topic': '실제 주제1',
                'hook_pattern': 3,
                'segments': [
                  {'order_index': 0, 'content': '본문 내용'},
                  {'order_index': 1, 'content': '댓글1 내용'},
                ]
              },
              {
                'topic': '실제 주제2',
                'hook_pattern': 1,
                'segments': [
                  {'order_index': 0, 'content': '본문 내용'},
                  {'order_index': 1, 'content': '댓글1 내용'},
                ]
              },
              {
                'topic': '실제 주제3',
                'hook_pattern': 6,
                'segments': [
                  {'order_index': 0, 'content': '본문 내용'},
                  {'order_index': 1, 'content': '댓글1 내용'},
                ]
              }
            ]
            with open('/tmp/posts_batch.json', 'w') as f:
                json.dump(posts, f, ensure_ascii=False, indent=2)
            print('저장 완료')
            "
            ```

            저장 후 반드시 확인:
            ```bash
            cat /tmp/posts_batch.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'{len(d)}개 저장됨')"
            ```

            **Supabase 저장은 하지 마세요. 파일 저장만 합니다.**

      - name: "💾 Supabase 저장"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SERVICE_KEY = os.environ["SUPABASE_SERVICE_KEY"]

          headers = {
              "apikey": SERVICE_KEY,
              "Authorization": f"Bearer {SERVICE_KEY}",
              "Content-Type": "application/json",
              "Prefer": "return=representation",
          }

          def supabase_post(path, body):
              url = f"{SUPABASE_URL}/rest/v1/{path}"
              data = json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method="POST")
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          with open("/tmp/posts_batch.json") as f:
              posts = json.load(f)

          for post in posts:
              post_record = supabase_post("threads_posts", {
                  "topic": post["topic"],
                  "hook_pattern": post.get("hook_pattern"),
                  "status": "draft",
              })
              post_id = post_record[0]["id"]
              print(f"✅ 저장됨: {post_id}")

              segments = [
                  {"post_id": post_id, "order_index": s["order_index"], "content": s["content"]}
                  for s in post["segments"]
              ]
              supabase_post("threads_post_segments", segments)
              print(f"   세그먼트 {len(segments)}개 저장")

          print(f"\n✅ 완료 — 드래프트 {len(posts)}개 저장됨")
          EOF

      - name: "📋 생성된 게시글 미리보기"
        run: |
          python3 - <<'EOF'
          import json

          with open("/tmp/posts_batch.json") as f:
              posts = json.load(f)

          for i, post in enumerate(posts, 1):
              print(f"\n{'='*60}")
              print(f"  게시글 {i}: {post['topic']}")
              print(f"  훅 패턴: {post.get('hook_pattern', '-')}")
              print(f"{'='*60}")
              for seg in sorted(post["segments"], key=lambda s: s["order_index"]):
                  label = "📌 본문" if seg["order_index"] == 0 else f"💬 댓글{seg['order_index']}"
                  print(f"\n[{label}]")
                  print(seg["content"])
          print(f"\n{'='*60}")
          EOF
